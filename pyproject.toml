[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-api-monitor"
version = "1.0.0"
description = "Option Chain Monitor - REST API for real-time option chain monitoring"
readme = "doc/README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["trading", "options", "monitor", "api", "rest", "nslogger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Flask>=2.3.0",
    "aiohttp==3.9.3",
    "black==25.12.0",
    "certifi>=2023.0.0",
    "dhanhq>=2.0.0",
    "flake8==7.3.0",
    "fyers-apiv3>=2.0.0",
    "googleapis-common-protos>=1.56.0",
    "mypy==1.19.1",
    "numpy==2.4.1",
    "pandas==2.3.3",
    "protobuf>=3.20.0",
    "pytest==9.0.2",
    "python-certifi-win32==1.6.1",
    "python-dotenv>=0.21.0",
    "requests>=2.28.0",
    "sphinx-rtd-theme==3.0.2",
    "sphinx==8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/trading-api-monitor"
Documentation = "https://github.com/yourusername/trading-api-monitor/wiki"
Repository = "https://github.com/yourusername/trading-api-monitor.git"
"Bug Tracker" = "https://github.com/yourusername/trading-api-monitor/issues"

[project.scripts]
option-chain-monitor = "option_chain_monitor_api_simple:main"
trading-api-post-install = "post_install:main"

[tool.setuptools]
packages = ["client", "client.utils", "client.libs"]
py-modules = ["option_chain_monitor_api_simple", "post_install"]
include-package-data = true

[tool.setuptools.package-data]
client = ["libs/*.tar.gz", "*.bat"]
"*" = ["requirements.txt"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=client --cov-report=html"
